name: CD - Azure VM e Blob Static Website

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/techstore-api:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: FRONT/package-lock.json

      - name: Configurar endereço da API
        working-directory: FRONT
        env:
          API_URL: ${{ vars.API_URL }}
        run: sed -i "s|https://app-techstore-api-caua.azurewebsites.net/api/v1|${API_URL}|g" src/environments/environment.production.ts

      - name: Compilar frontend Angular
        working-directory: FRONT
        run: npm ci && npm run build

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem da API
        uses: docker/build-push-action@v6
        with:
          context: API
          push: true
          tags: ${{ env.IMAGE }}

      - name: Entrar no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Atualizar API na VM
        run: |
          az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "TOKEN=\$(curl -sS -H Metadata:true 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net' | jq -r .access_token); CONNECTION=\$(curl -sS -H \"Authorization: Bearer \$TOKEN\" 'https://${{ vars.AZURE_KEY_VAULT_NAME }}.vault.azure.net/secrets/ConnectionStrings--DefaultConnection?api-version=7.4' | jq -r .value); docker pull '${{ env.IMAGE }}'; docker pull caddy:2-alpine; docker rm -f techstore-api techstore-proxy || true; docker run -d --restart unless-stopped --name techstore-api --log-driver=syslog -p 127.0.0.1:8080:8080 -e ASPNETCORE_ENVIRONMENT=Production -e ConnectionStrings__DefaultConnection=\"\$CONNECTION\" -e Cors__AllowedOrigins__0='${{ vars.FRONTEND_URL }}' '${{ env.IMAGE }}'; docker run -d --restart unless-stopped --name techstore-proxy --network host --log-driver=syslog -v caddy_data:/data caddy:2-alpine caddy reverse-proxy --from '${{ vars.API_HOST }}' --to 'http://127.0.0.1:8080'"

      - name: Publicar frontend no Blob Storage
        run: az storage blob upload-batch --auth-mode login --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" --destination '$web' --source FRONT/dist/techstore-cloud-frontend/browser --overwrite
