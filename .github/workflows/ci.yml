name: CI - API e Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: Build e testes da API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore "TechStore Cloud.sln"
      - run: dotnet build "TechStore Cloud.sln" -c Release --no-restore
      - run: dotnet test "TechStoreCloud.Tests/TechStoreCloud.Tests.csproj" -c Release --no-build

  frontend:
    name: Build do Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: FRONT/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: techstore-frontend
          path: FRONT/dist/techstore-cloud-frontend/browser
