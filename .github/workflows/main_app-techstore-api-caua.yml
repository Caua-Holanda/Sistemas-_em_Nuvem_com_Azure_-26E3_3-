name: CD - API e Frontend no Azure

on:
  push:
    branches: [main]
    paths:
      - "API/**"
      - "FRONT/**"
      - ".github/workflows/main_app-techstore-api-caua.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: app-techstore-api-caua
  AZURE_RESOURCE_GROUP: rg-techstore-dev
  FRONTEND_ORIGIN: https://sttechstorecaua2026.z47.web.core.windows.net

jobs:
  build-api:
    name: Compilar e testar a API
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restaurar dependências
        run: dotnet restore "API/TechStore Cloud.sln"

      - name: Compilar solução
        run: dotnet build "API/TechStore Cloud.sln" -c Release --no-restore

      - name: Executar testes
        run: dotnet test "API/TechStoreCloud.Tests/TechStoreCloud.Tests.csproj" -c Release --no-build

      - name: Publicar API
        run: dotnet publish "API/TechStore Cloud/TechStore Cloud.csproj" -c Release --no-build -o api-publish

      - name: Guardar pacote da API
        uses: actions/upload-artifact@v4
        with:
          name: techstore-api
          path: api-publish
          if-no-files-found: error

  deploy-api:
    name: Implantar API no App Service
    runs-on: ubuntu-latest
    needs: build-api
    permissions:
      id-token: write
      contents: read
    outputs:
      api-url: ${{ steps.api-address.outputs.url }}

    steps:
      - name: Baixar pacote da API
        uses: actions/download-artifact@v4
        with:
          name: techstore-api
          path: api-publish

      - name: Entrar no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BC1AC4B506AD43899A173CE8D508E3CA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AB71CA29D6FA440283529EB3F0A27B77 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_05238C660BCB4607BD49C70F1A9B7784 }}

      - name: Configurar origem permitida no CORS
        run: >-
          az webapp config appsettings set
          --resource-group "$AZURE_RESOURCE_GROUP"
          --name "$AZURE_WEBAPP_NAME"
          --settings "Cors__AllowedOrigins__0=$FRONTEND_ORIGIN"
          --output none

      - name: Implantar no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: api-publish

      - name: Descobrir endereço real da API
        id: api-address
        shell: bash
        run: |
          host=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query defaultHostName -o tsv)
          test -n "$host"
          echo "url=https://$host/api/v1" >> "$GITHUB_OUTPUT"
          echo "API publicada em https://$host"

  deploy-frontend:
    name: Compilar e implantar Angular no Storage
    runs-on: ubuntu-latest
    needs: deploy-api

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: FRONT/package-lock.json

      - name: Configurar endereço real da API
        shell: bash
        env:
          API_URL: ${{ needs.deploy-api.outputs.api-url }}
        run: |
          test -n "$API_URL"
          printf "export const environment = {\n  production: true,\n  apiUrl: '%s',\n};\n" "$API_URL" > FRONT/src/environments/environment.production.ts

      - name: Instalar dependências e compilar Angular
        working-directory: FRONT
        run: |
          npm ci
          npm run build

      - name: Guardar pacote do frontend
        uses: actions/upload-artifact@v4
        with:
          name: techstore-frontend
          path: FRONT/dist/techstore-cloud-frontend/browser
          if-no-files-found: error

      - name: Validar segredo do Storage
        shell: bash
        env:
          STORAGE_CONNECTION: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          if [ -z "$STORAGE_CONNECTION" ]; then
            echo "Cadastre o segredo AZURE_STORAGE_CONNECTION_STRING nas Actions do repositório."
            exit 1
          fi

      - name: Implantar frontend no site estático
        shell: bash
        env:
          STORAGE_CONNECTION: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: >-
          az storage blob upload-batch
          --connection-string "$STORAGE_CONNECTION"
          --destination '$web'
          --source FRONT/dist/techstore-cloud-frontend/browser
          --overwrite true
          --output none

      - name: Resumo da implantação
        run: |
          echo "### Implantação concluída" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ needs.deploy-api.outputs.api-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: $FRONTEND_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
